# CI/CD — publica o app no Cloudflare Workers automaticamente.
#
# Quando roda: a cada envio (push) para a branch "main", ou manualmente
# pelo botao "Run workflow" na aba Actions do GitHub.
#
# Segredos necessarios (Settings > Secrets and variables > Actions no GitHub):
#   - CLOUDFLARE_API_TOKEN   -> token com permissao "Edit Cloudflare Workers"
#                               MAIS "Account > D1 > Edit", exigida pelo passo
#                               que aplica as migrations.
#                               Permissao de R2 NAO e necessaria: publicar um
#                               Worker com bucket associado nao mexe no conteudo
#                               do bucket. Quem le e grava arquivos e o app
#                               rodando, pelo binding — nao o token do deploy.
#   - CLOUDFLARE_ACCOUNT_ID  -> ID da sua conta Cloudflare
#
# O SESSION_SECRET nao entra aqui: ele fica guardado no proprio Worker
# (npx wrangler secret put SESSION_SECRET) e o deploy nao precisa conhece-lo.

name: Deploy para Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Evita dois deploys rodando ao mesmo tempo; mantem so o mais recente.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24, e nao 22, porque os testes usam o "node:sqlite" embutido —
          # que no Node 22 ainda exige a flag --experimental-sqlite. E' tambem a
          # versao da maquina do Lucas, entao CI e local rodam igual.
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Confere as regras de acesso, o login e a entrega de arquivos antes de
      # publicar. Se algo aqui falhar, o deploy nao acontece.
      - name: Rodar os testes
        run: npm run test

      - name: Build para o Cloudflare
        run: npm run build:cloudflare

      # Aplica ao banco de producao as migrations novas de migrations/*.sql.
      # E' seguro repetir: o wrangler anota quais ja foram aplicadas e pula.
      # Roda antes do deploy para o site novo nunca encontrar um banco velho.
      # Chamada direta ao wrangler do projeto, e nao pela action: a action
      # envolve o comando e mostra so "o processo falhou com codigo 1",
      # escondendo a mensagem real quando algo da errado.
      #
      # O "--config wrangler.jsonc" e' proposital. Sem ele, o wrangler acha o
      # .wrangler/deploy/config.json que o build acabou de gerar e passa a ler o
      # .output/server/wrangler.json — cujo diretorio nao contem a pasta
      # migrations/.
      - name: Atualizar o banco (D1)
        run: node node_modules/wrangler/bin/wrangler.js d1 migrations apply acervo --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar no Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
